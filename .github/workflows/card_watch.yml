name: card-watch

# 每周一次（周五美股收盘后）跑卡片价格巡检，开一个 Issue 指派给仓库所有者 → GitHub 发邮件。
# 信里有：本周新到买入线的卡、涨回线上的卡、新进 10% 以内的卡，以及 A/B 组全表。
# 手动触发：Actions → card-watch → Run workflow。
on:
  schedule:
    - cron: "45 21 * * 5"   # 周五 21:45 UTC = 美东 16:45（夏令时）/ 17:45（冬令时），美股收盘后；北京时间周六早上
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: card-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run card_watch (prices vs buy-below lines)
        run: python scripts/card_watch/card_watch.py

      - name: Compare with last state
        id: decide
        env:
          DIGEST: "1"   # 每次都发全表（一周一封）
        run: python scripts/card_watch/alert.py

      - name: Open issue (GitHub e-mails the assignee)
        if: steps.decide.outputs.alert == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = fs.readFileSync('scripts/card_watch/out/alert_title.txt', 'utf8').trim();
            const body = fs.readFileSync('scripts/card_watch/out/alert_body.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, assignees: [context.repo.owner],
            });

      - name: Keep today's tables as an artifact (90 days)
        uses: actions/upload-artifact@v4
        with:
          name: card_watch_${{ github.run_id }}
          path: |
            scripts/card_watch/out/card_watch_*.md
            scripts/card_watch/out/card_watch_*.csv
            scripts/card_watch/out/alert_body.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit state.json if it changed
        run: |
          git config user.name "card-watch bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/card_watch/state.json
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git commit -m "card_watch state $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
